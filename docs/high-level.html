<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Article Writing Workflow</title>
<style>
  :root {
    --line: #b9b9b9;
    --card: #fff;
    --border: #ccc;
    --muted: #666;
    --gate: #c8892e;
    --gate-bg: #fff8f0;
    --red: #b23a2e;
    --green: #2e7d32;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fafafa;
    color: #1a1a1a;
    margin: 0;
    padding: 32px 20px 80px;
  }
  h1 { font-size: 1.4rem; font-weight: 600; margin: 0 0 4px; text-align: center; }
  .hint { font-size: 0.82rem; color: var(--muted); margin-bottom: 24px; text-align: center; }

  /* Two-column layout: flow on the left, detail panel on the right */
  .layout {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 40px;
    max-width: 1000px;
    margin: 0 auto;
  }
  .flow { display: flex; flex-direction: column; align-items: center; flex: 0 0 auto; }

  .link { width: 2px; height: 20px; background: var(--line); }

  /* Step card */
  .step {
    width: 320px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    padding: 13px 16px;
    cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .step:hover { border-color: #999; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .step.active { border-color: #333; box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
  .step .chev { color: var(--muted); font-size: 0.75rem; flex: 0 0 auto; }
  .step .titles { flex: 1; }
  .step .title { font-weight: 600; font-size: 1rem; }
  .step .sub { font-size: 0.82rem; color: var(--muted); margin-top: 2px; }
  .step.adv { border: 2px solid var(--red); }
  .step.adv .title { color: var(--red); }

  /* Gate: pass path down + labelled 'no' loop-back drawn in SVG */
  .gate { display: flex; align-items: center; gap: 0; }
  .gate .loopback { width: 150px; height: 132px; }
  .diamond-wrap { display: flex; flex-direction: column; align-items: center; }
  .diamond {
    width: 96px; height: 96px;
    background: var(--gate-bg);
    border: 1.5px solid var(--gate);
    transform: rotate(45deg);
    display: flex; align-items: center; justify-content: center;
  }
  .diamond span {
    transform: rotate(-45deg);
    font-size: 0.64rem; font-weight: 600; color: #9a6a1e;
    text-align: center; line-height: 1.25; width: 100px;
  }
  .yes { font-size: 0.68rem; color: var(--green); font-weight: 600; margin-top: 3px; }
  .spacer { width: 150px; }

  /* Detail side panel (sticky, so the flow never jumps) */
  .panel {
    flex: 0 0 340px;
    position: sticky;
    top: 32px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fcfbf9;
    padding: 16px 18px;
    min-height: 200px;
  }
  .panel.adv-mode { border-color: var(--red); }
  .panel .p-step { font-size: 0.75rem; color: var(--gate); font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; }
  .panel .p-title { font-weight: 600; font-size: 1.05rem; margin: 2px 0 12px; }
  .panel.adv-mode .p-step { color: var(--red); }
  .panel ol { margin: 0; padding-left: 20px; font-size: 0.83rem; color: #444; line-height: 1.55; }
  .panel li { margin-bottom: 5px; }
  .panel .summary {
    margin-top: 12px; padding-top: 10px; border-top: 1px solid #ececec;
    font-size: 0.8rem; color: #444; line-height: 1.5;
  }
  .panel .summary div { margin-bottom: 4px; }
  .panel .summary .k { font-weight: 600; }
  .panel .note { font-size: 0.77rem; color: #888; font-style: italic; margin-top: 10px; }
  .panel .placeholder { color: #999; font-size: 0.85rem; font-style: italic; }

  .loop-note {
    width: 320px; text-align: center;
    font-size: 0.8rem; color: var(--muted); margin: 14px 0 4px;
  }
  .loop-note .cap { font-weight: 600; color: var(--red); }

  .routing {
    width: 470px; max-width: 100%;
    border: 1.5px dashed var(--red);
    border-radius: 8px; background: #fff;
    padding: 14px 18px; margin-top: 10px;
  }
  .routing .r-title { font-weight: 600; font-size: 0.85rem; margin-bottom: 4px; }
  .routing .r-intro { font-size: 0.78rem; color: var(--muted); margin-bottom: 10px; }
  .route { display: flex; align-items: flex-start; gap: 8px; padding: 7px 0; border-top: 1px solid #eee; font-size: 0.79rem; }
  .route .verdict { flex: 0 0 150px; font-weight: 600; color: var(--red); }
  .route .back { flex: 0 0 88px; color: var(--red); white-space: nowrap; }
  .route .why { color: #444; line-height: 1.4; }

  .publish {
    width: 320px; border: 2px solid var(--green);
    border-radius: 8px; background: #fff;
    padding: 14px 18px; text-align: center;
    font-weight: 600; color: var(--green); margin-top: 6px;
  }

  @media (max-width: 780px) {
    .layout { flex-direction: column; align-items: center; }
    .panel { position: static; width: 320px; flex: 0 0 auto; margin-top: 24px; }
  }
</style>
</head>
<body>
  <h1>Article Writing Workflow</h1>
  <div class="hint">Click any step to see its subprocess in the panel on the right. Diamonds are QA gates: a "no" loops back, bounded to 3 tries, then escalates to an earlier step.</div>

  <div class="layout">
    <div class="flow" id="flow"></div>

    <div class="panel" id="panel">
      <div class="placeholder">Select a step to view its subprocess.</div>
    </div>
  </div>

<script>
  // Loop-back arrow for a failed gate: 'no' exits the diamond, curves up,
  // re-enters the step above. Bounded at 3 tries, then escalates.
  function loopbackSVG(label, escalate) {
    return `
      <svg class="loopback" viewBox="0 0 150 150" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="lbhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M2 1 L8 5 L2 9" fill="none" stroke="#c8892e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </marker>
        </defs>
        <path d="M150 66 L96 66 C40 66 40 66 40 30 L40 4"
              stroke="#c8892e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#lbhead)"/>
        <text x="150" y="60" text-anchor="end" font-size="11" font-weight="600" fill="#c8892e">no</text>
        <text x="46" y="70" font-size="10" fill="#9a6a1e">${label}</text>
        <text x="40" y="118" text-anchor="middle" font-size="10" font-weight="600" fill="#c8892e">max 3&#215;</text>
        <text x="40" y="132" text-anchor="middle" font-size="9" fill="#b23a2e">then &#8593; ${escalate}</text>
      </svg>`;
  }

  const steps = [
    {
      n: "1", title: "Define scope", sub: "Angle, reader, one-sentence thesis",
      body: `<ol>
        <li>Interrogate the raw topic &mdash; find the narrower thing inside it</li>
        <li>Pick your angle &mdash; the lens or claim with friction</li>
        <li>Identify your specific reader &mdash; not "everyone"</li>
        <li>Set a working hypothesis / central question (provisional, not a locked takeaway)</li>
        <li>Stress-test with the one-sentence rule; loop back if it won't hold</li>
      </ol>
      <div class="note">Hypothesis is confirmed, revised, or discarded after Step 2.</div>`,
      gate: { q: "One clean sentence?", fix: "narrow scope", esc: "flag run" }
    },
    {
      n: "2", title: "Research deeply", sub: "Over-collect, note sources",
      body: `<ol>
        <li>Map the territory &mdash; wide but shallow first</li>
        <li>Go to primary sources &mdash; trace claims to their root</li>
        <li>Hunt disconfirming evidence &mdash; find the smartest opponent</li>
        <li>Triangulate &mdash; converge independent sources; mine conflicts</li>
        <li>Capture as you go &mdash; notes, sources, and your own thinking</li>
      </ol>
      <div class="summary">
        <div><span class="k">Stop when:</span> new sources stop surprising you (saturation); you can argue every part of the thesis, including objections; scope is covered.</div>
        <div><span class="k">Probe further when:</span> a surprise, a source conflict, a load-bearing claim, or an unsourced "everyone knows" consensus.</div>
        <div><span class="k">Document by:</span> paraphrasing in your own words; sourcing every claim; separating facts / sources / thinking; organizing around questions, not sources.</div>
      </div>
      <div class="note">Findings loop back to revise the hypothesis or scope.</div>`,
      gate: { q: "Key claims sourced + counter-evidence found?", fix: "keep researching", esc: "Step 1" }
    },
    {
      n: "3", title: "Find the structure", sub: "Outline hook, argument, close",
      body: `<ol>
        <li>Extract your claims from the research &mdash; hypothesis becomes settled thesis</li>
        <li>Find the through-line &mdash; the single spine the piece hangs on</li>
        <li>Sequence for the reader &mdash; dependencies first, not discovery order</li>
        <li>Design the opening tension and the closing payoff (mark the jobs, don't write them)</li>
        <li>Outline one line per section &mdash; each states its job and its point</li>
      </ol>
      <div class="note">Anything off the through-line is a candidate for cutting.</div>`,
      gate: { q: "Every claim on-spine & backed?", fix: "fix outline", esc: "Step 2" }
    },
    {
      n: "4", title: "Draft fast and ugly", sub: "Finish before polishing",
      body: `<ol>
        <li>Silence the editor &mdash; no rereading or polishing this pass</li>
        <li>Follow the outline, but let it flex if a better idea appears</li>
        <li>Write placeholders &mdash; drop [check stat] markers, keep moving</li>
        <li>Skip the hard parts and return &mdash; write what has energy now</li>
        <li>Reach the end at all costs &mdash; a complete rough draft, however ugly</li>
      </ol>
      <div class="note">Separate generation from judgment: momentum over polish.</div>`,
      gate: { q: "Complete draft, placeholders visible?", fix: "finish it", esc: "Step 3" }
    },
    {
      n: "5", title: "Revise in passes", sub: "Structure, then sentences, then proofreading",
      body: `<ol>
        <li>Clear verification first &mdash; resolve [check stat] markers and load-bearing claims</li>
        <li>Structural pass &mdash; does the argument flow? Cut anything off the through-line</li>
        <li>Paragraph pass &mdash; one clear point each; merge, split, or delete</li>
        <li>Sentence pass &mdash; clarity, rhythm, filler; read aloud</li>
        <li>Proofreading last &mdash; typos, punctuation, formatting</li>
      </ol>
      <div class="note">Ordered destructive &rarr; fine, so polished work isn't thrown away.</div>`,
      gate: { q: "Each pass's defect class cleared?", fix: "rerun pass", esc: "Step 3" }
    },
    {
      n: "6", title: "Sharpen open and close", sub: "Rewrite intro after drafting",
      body: `<ol>
        <li>Rewrite the intro last &mdash; match what the piece became</li>
        <li>Make the hook create tension &mdash; question, surprise, or friction</li>
        <li>Check promise-payoff match &mdash; realign whichever drifted</li>
        <li>Land the ending &mdash; an implication or turn, not a summary</li>
        <li>Test the seam &mdash; read intro-into-body and body-into-close as one</li>
      </ol>
      <div class="note">Both ends written after the body, so they fuse instead of bolt on.</div>`,
      gate: { q: "Promise matches payoff?", fix: "realign ends", esc: "Step 5" }
    },
    {
      n: "7", title: "Rest, then second eyes", sub: "Reread cold, get a reader",
      body: `<ol>
        <li>Let it sit &mdash; ideally overnight, to gain distance</li>
        <li>Reread cold &mdash; as a reader; mark confusion and boredom</li>
        <li>Get an outside reader &mdash; ask where they lost the thread</li>
        <li>Separate signal from noise &mdash; fix confusion, not every preference</li>
        <li>Final read, then ship &mdash; done beats perfect</li>
      </ol>
      <div class="note">Distance is bought, not manufactured on demand.</div>`,
      gate: { q: "Cold-read confusions resolved?", fix: "fix, reread", esc: "Step 5" }
    },
    {
      n: "8", title: "Adversarial review gate", sub: "Try to make the article fail", adv: true,
      body: `<ol>
        <li>Invert the goal &mdash; reviewer attacks the piece, doesn't help it (ideally a separate person)</li>
        <li>Extract every checkable claim afresh &mdash; ignore the author's markers</li>
        <li>Re-source each claim independently &mdash; never reuse the author's citation</li>
        <li>Check claim matches source &mdash; catch overstatement and stripped caveats</li>
        <li>Attack load-bearing claims hardest &mdash; multiple confirmations</li>
        <li>Classify each: verified / wrong / unsupported / misrepresented</li>
      </ol>
      <div class="note">Independent sourcing checks external truth; shared sources only check internal consistency.</div>`,
      gate: null
    }
  ];

  const flow = document.getElementById("flow");
  const panel = document.getElementById("panel");

  steps.forEach((s, i) => {
    const card = document.createElement("div");
    card.className = "step" + (s.adv ? " adv" : "");
    card.innerHTML = `<span class="chev">&#9654;</span>
      <div class="titles"><div class="title">${s.n}. ${s.title}</div><div class="sub">${s.sub}</div></div>`;
    card.onclick = () => select(i);
    flow.appendChild(card);

    if (s.gate) {
      flow.appendChild(div("link"));
      const g = document.createElement("div");
      g.className = "gate";
      g.innerHTML = loopbackSVG(s.gate.fix, s.gate.esc) +
        `<div class="diamond-wrap"><div class="diamond"><span>${s.gate.q}</span></div><div class="yes">yes &#8595;</div></div>` +
        `<div class="spacer"></div>`;
      flow.appendChild(g);
      flow.appendChild(div("link"));
    }
  });

  // Adversarial loop + routing + publish, appended after step 8
  const tail = document.createElement("div");
  tail.style.display = "flex";
  tail.style.flexDirection = "column";
  tail.style.alignItems = "center";
  tail.innerHTML = `
    <div class="loop-note"><span class="cap">Loop:</span> min 1 review, max 5. Re-review after each revision.<br>
      Stop early when nothing substantive is left to attack (cosmetic nitpicks don't count).</div>
    <div class="routing">
      <div class="r-title">Severity-based loop-back &mdash; routed by the fact-check verdict</div>
      <div class="r-intro">Each failure type returns to a different step, then re-enters the gate. Still finding real problems at review 5 signals a deep flaw &mdash; drop to Step 1/3.</div>
      <div class="route"><div class="verdict">Unsupported</div><div class="back">&#8593; Step 2</div><div class="why">No independent source found &mdash; research didn't finish. Find the source or cut the claim.</div></div>
      <div class="route"><div class="verdict">Wrong (peripheral)</div><div class="back">&#8593; Step 5</div><div class="why">A non-load-bearing fact is false &mdash; correct it in place and re-review.</div></div>
      <div class="route"><div class="verdict">Wrong / misrepresented (load-bearing)</div><div class="back">&#8593; Step 3 (or 1)</div><div class="why">The thesis rests on a false premise &mdash; rebuild structure around what's true, or rethink the angle.</div></div>
    </div>
    <div class="link"></div>
    <div class="publish">Publish &mdash; clean review, or 5-review cap reached</div>`;
  flow.appendChild(tail);

  function div(cls) { const d = document.createElement("div"); d.className = cls; return d; }

  function select(i) {
    document.querySelectorAll(".step").forEach((el, idx) => el.classList.toggle("active", idx === i));
    const s = steps[i];
    panel.classList.toggle("adv-mode", !!s.adv);
    panel.innerHTML = `<div class="p-step">Step ${s.n}${s.adv ? " &middot; Gate" : ""}</div>
      <div class="p-title">${s.title}</div>${s.body}`;
  }

  select(0);
</script>
</body>
</html>
